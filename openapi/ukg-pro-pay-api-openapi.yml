openapi: 3.2.0
info:
  title: UKG Pro HCM Pay API
  version: 1.0.0
  summary: REST interface for the UKG Pro Human Capital Management suite.
  description: 'The UKG Pro HCM API exposes Human Capital Management resources (people,

    employment, benefits, payroll, talent, recruiting, onboarding) for the

    UKG Pro platform.'
  contact:
    name: UKG Developer Portal
    url: https://developer.ukg.com/hcm
  license:
    name: Proprietary
    url: https://www.ukg.com/legal
servers:
- url: https://{tenantHostName}/api
  description: Tenant-specific UKG Pro HCM API host
  variables:
    tenantHostName:
      default: configuration.ultipro.com
      description: Customer-specific UKG Pro hostname assigned at provisioning
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Pay
  description: Pay statements, earnings, and payroll data
paths:
  /pay/v1/pay-statements:
    get:
      tags:
      - Pay
      summary: List pay statements
      operationId: listPayStatements
      parameters:
      - $ref: '#/components/parameters/EmployeeIdQuery'
      - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Pay statement collection
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PayStatement'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  parameters:
    EmployeeIdQuery:
      name: employeeId
      in: query
      schema:
        type: string
    Page:
      name: page
      in: query
      description: Page number for pagination
      schema:
        type: integer
        minimum: 1
        default: 1
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    PayStatement:
      type: object
      properties:
        statementId:
          type: string
        employeeId:
          type: string
        payPeriodStart:
          type: string
          format: date
        payPeriodEnd:
          type: string
          format: date
        grossPay:
          type: number
        netPay:
          type: number
  responses:
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication using a UKG Pro web service account.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer Authorization Token issued for onboarding and recruiting APIs.
