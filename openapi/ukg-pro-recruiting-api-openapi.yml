openapi: 3.2.0
info:
  title: UKG Pro HCM Recruiting API
  version: 1.0.0
  summary: REST interface for the UKG Pro Human Capital Management suite.
  description: 'The UKG Pro HCM API exposes Human Capital Management resources (people,

    employment, benefits, payroll, talent, recruiting, onboarding) for the

    UKG Pro platform.'
  contact:
    name: UKG Developer Portal
    url: https://developer.ukg.com/hcm
  license:
    name: Proprietary
    url: https://www.ukg.com/legal
servers:
- url: https://{tenantHostName}/api
  description: Tenant-specific UKG Pro HCM API host
  variables:
    tenantHostName:
      default: configuration.ultipro.com
      description: Customer-specific UKG Pro hostname assigned at provisioning
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Recruiting
  description: Recruiting and applicant tracking
paths:
  /recruiting/v1/candidates:
    get:
      tags:
      - Recruiting
      summary: List recruiting candidates
      description: 'Recruiting endpoints require an Authorization Token (bearer) rather

        than Basic Auth.'
      operationId: listCandidates
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Candidate collection
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Candidate'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    Candidate:
      type: object
      properties:
        candidateId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        emailAddress:
          type: string
          format: email
        requisitionId:
          type: string
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication using a UKG Pro web service account.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer Authorization Token issued for onboarding and recruiting APIs.
